# Test-only composition for the persistent attention inbox: boots the real
# task-flow storage stack plus the attention service, so the driver parks a
# phase run in awaiting-decision, creates one decision item, resolves it, and
# asserts the item state, the resume, and the journal fact through the same
# path the base bundle mounts.
- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js process.env.DSH_ATTENTION_E2E_ROOT ?? '.'

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: recipe
  name: '@deepseek-ai/dsh-recipe'

- id: workbench-journal
  name: '@deepseek-ai/dsh-workbench-journal'

- id: deliverable-local
  name: '@deepseek-ai/dsh-deliverable-local'

- id: impact-propagation
  name: '@deepseek-ai/dsh-impact-propagation'

- id: task-local
  name: '@deepseek-ai/dsh-task-local'

- id: attention
  name: '@deepseek-ai/dsh-attention'
