# Test-only composition for the per-kind executor registry: boots the real
# task-flow storage stack plus recipe-multiphase over the engine, so a
# two-phase recipe runs each phase through the executor registered for its
# kind through the same path the base bundle mounts. The driver registers
# the agent factory, the two kind executors, and the recipe programmatically.
- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js process.env.DSH_RECIPE_MULTIPHASE_E2E_ROOT ?? '.'

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: recipe
  name: '@deepseek-ai/dsh-recipe'

- id: workbench-journal
  name: '@deepseek-ai/dsh-workbench-journal'

- id: deliverable-local
  name: '@deepseek-ai/dsh-deliverable-local'

- id: impact-propagation
  name: '@deepseek-ai/dsh-impact-propagation'

- id: task-local
  name: '@deepseek-ai/dsh-task-local'

- id: agent
  name: '@deepseek-ai/dsh-agent'

- id: goal
  name: '@deepseek-ai/dsh-goal'

- id: recipe-engine-core
  name: '@deepseek-ai/dsh-recipe-engine-core'

- id: recipe-multiphase
  name: '@deepseek-ai/dsh-recipe-multiphase'
