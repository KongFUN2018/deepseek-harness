# Test-only composition for the workbench journal: boots the real storage
# stack (hub, json backend, domain facility) so the journal service owns a
# durable domain through the same path the base bundle mounts.
- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    # Driver-private scratch root; the driver sets DSH_JOURNAL_E2E_ROOT and
    # !!js reads the environment at load so each run starts on a clean medium.
    root: !!js process.env.DSH_JOURNAL_E2E_ROOT ?? '.'

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: workbench-journal
  name: '@deepseek-ai/dsh-workbench-journal'
