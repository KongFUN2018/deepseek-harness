# Test-only composition for the minimal deliverable service: boots the real
# storage stack (hub, json backend, domain facility) so version chains persist
# through the same path the base bundle mounts.
- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    # Driver-private scratch root; !!js reads the environment at load so each
    # run starts on a clean medium.
    root: !!js process.env.DSH_DELIVERABLE_E2E_ROOT ?? '.'

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: deliverable-minimal
  name: '@deepseek-ai/dsh-deliverable-minimal'
