# Test-only composition for the attention incremental stream: boots the real
# task-flow storage stack, the attention service, and the stream service, so
# the driver creates and resolves one decision item and asserts the projected
# change feed through the same path the base bundle mounts.
- id: storage
  name: '@deepseek-ai/dsh-storage'

- id: storage-json
  name: '@deepseek-ai/dsh-storage-json'
  config:
    root: !!js process.env.DSH_WORKBENCH_HOST_STREAM_E2E_ROOT ?? '.'

- id: storage-domain
  name: '@deepseek-ai/dsh-storage-domain'
  config:
    backend: json

- id: recipe
  name: '@deepseek-ai/dsh-recipe'

- id: workbench-journal
  name: '@deepseek-ai/dsh-workbench-journal'

- id: deliverable-local
  name: '@deepseek-ai/dsh-deliverable-local'

- id: impact-propagation
  name: '@deepseek-ai/dsh-impact-propagation'

- id: task-local
  name: '@deepseek-ai/dsh-task-local'

- id: attention
  name: '@deepseek-ai/dsh-attention'

- id: workbench-host-stream
  name: '@deepseek-ai/dsh-workbench-host-stream'
